[build.environment]
  # Firebase web client config (NEXT_PUBLIC_*) is public by design: Next.js inlines it into the
  # browser bundle, so its values always appear in build output. FIREBASE_DATABASE_URL is the
  # same public Realtime Database URL the client uses. Exempt only these public keys
  # from secrets scanning; server-side secrets (service account, API keys) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_FIREBASE_DATABASE_URL,FIREBASE_DATABASE_URL"
